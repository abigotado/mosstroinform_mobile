name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - stage

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Tests, Analysis & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        flavor: [mock, prod]
        include:
          - flavor: mock
            apk_name: app-mock-release.apk
            artifact_name: app-mock-release-apk
          - flavor: prod
            apk_name: app-prod-release.apk
            artifact_name: app-prod-release-apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Build APK (${{ matrix.flavor }} flavor)
        run: flutter build apk --release --flavor ${{ matrix.flavor }} --dart-define=FLAVOR=${{ matrix.flavor }} --obfuscate --split-debug-info=build/app/outputs/symbols
        continue-on-error: false

      - name: List APK files
        run: |
          echo "=== Checking build directory structure ==="
          find build/ -type d -name "*apk*" 2>/dev/null | head -20 || echo "No APK directories found"
          echo ""
          echo "=== Searching for all APK files recursively ==="
          find build/ -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Contents of build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory not found"

      - name: Upload APK artifact (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/app/outputs/flutter-apk/${{ matrix.apk_name }}
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-desktop, build-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-release-apk
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'linux-*-release'
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'linux-*-release'
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'windows-*-release'
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'macos-*-release'
          merge-multiple: true

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'ios-*-release'
          merge-multiple: true

      - name: List all available artifacts (debug)
        run: |
          echo "=== Checking what artifacts were actually downloaded ==="
          echo "Current directory:"
          pwd
          echo ""
          echo "All files and directories:"
          ls -la
          echo ""
          echo "Looking for artifact directories:"
          find . -maxdepth 1 -type d \( -name "linux-*" -o -name "windows-*" -o -name "macos-*" -o -name "ios-*" \) 2>/dev/null | sort || echo "No artifact directories found"
          echo ""
          echo "Looking for APK files:"
          find . -name "*.apk" -type f 2>/dev/null | head -10 || echo "No APK files found"

      - name: Verify downloaded artifacts structure
        run: |
          echo "=== Current working directory ==="
          pwd
          echo ""
          echo "=== All files and directories in root ==="
          ls -la
          echo ""
          echo "=== Searching for artifact directories ==="
          echo "Looking for linux-*-release:"
          find . -maxdepth 1 -type d -name "linux-*-release" 2>/dev/null | sort || echo "  None found"
          echo "Looking for windows-*-release:"
          find . -maxdepth 1 -type d -name "windows-*-release" 2>/dev/null | sort || echo "  None found"
          echo "Looking for macos-*-release:"
          find . -maxdepth 1 -type d -name "macos-*-release" 2>/dev/null | sort || echo "  None found"
          echo "Looking for ios-*-release:"
          find . -maxdepth 1 -type d -name "ios-*-release" 2>/dev/null | sort || echo "  None found"
          echo ""
          echo "=== Full directory tree (first 100 items) ==="
          find . -maxdepth 3 | head -100 || true

      - name: List downloaded artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          ls -la
          echo ""
          echo "=== Looking for artifact directories ==="
          find . -maxdepth 1 -type d \( -name "linux-*" -o -name "windows-*" -o -name "macos-*" -o -name "ios-*" \) 2>/dev/null | sort

      - name: List downloaded APK files
        run: ls -la *.apk 2>/dev/null || echo "No APK files found"

      - name: Debug downloaded artifacts
        run: |
          echo "=== Current directory structure ==="
          pwd
          ls -la
          echo ""
          echo "=== Looking for desktop artifact directories (maxdepth 1) ==="
          find . -maxdepth 1 -type d \( -name "linux-*" -o -name "windows-*" -o -name "macos-*" \) 2>/dev/null | sort
          echo ""
          echo "=== Looking for desktop artifact directories (maxdepth 2) ==="
          find . -maxdepth 2 -type d \( -name "linux-*" -o -name "windows-*" -o -name "macos-*" \) 2>/dev/null | sort
          echo ""
          echo "=== All directories ==="
          ls -d */ 2>/dev/null || echo "No subdirectories found"
          echo ""
          echo "=== Checking if artifacts were downloaded ==="
          ARTIFACTS_FOUND=0
          for artifact_dir in linux-prod-release windows-prod-release macos-prod-release macos-mock-release; do
            if [ -d "$artifact_dir" ]; then
              echo "✅ Found: $artifact_dir"
              echo "   Contents:"
              ls -la "$artifact_dir" | head -10 || true
              ARTIFACTS_FOUND=$((ARTIFACTS_FOUND + 1))
            else
              echo "❌ Not found: $artifact_dir"
            fi
          done
          echo ""
          if [ $ARTIFACTS_FOUND -eq 0 ]; then
            echo "⚠️ No desktop artifacts found - this may indicate build-desktop job didn't upload artifacts"
            echo ""
            echo "=== Checking for any release directories ==="
            find . -maxdepth 1 -type d -name "*release*" 2>/dev/null | sort || echo "No release directories found"
            echo ""
            echo "=== Checking for any directories with 'linux', 'windows', or 'macos' in name ==="
            find . -maxdepth 1 -type d \( -name "*linux*" -o -name "*windows*" -o -name "*macos*" \) 2>/dev/null | sort || echo "No matching directories found"
            echo ""
            echo "=== Listing all files and directories recursively (first 50) ==="
            find . -type f -o -type d | head -50 || true
          else
            echo "✅ Found $ARTIFACTS_FOUND desktop artifact(s)"
          fi

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Reorganize artifact directories
        run: |
          echo "=== Reorganizing artifact directories ==="
          # Когда используем merge-multiple: true, артефакты могут быть извлечены в поддиректории
          # Нужно проверить структуру и переместить содержимое в правильные директории
          
          # Проверяем, есть ли директории с правильными именами артефактов
          ARTIFACT_DIRS=$(find . -maxdepth 1 -type d \( -name "linux-*-release" -o -name "windows-*-release" -o -name "macos-*-release" -o -name "ios-*-release" \) 2>/dev/null | sort)
          
          if [ -z "$ARTIFACT_DIRS" ]; then
            echo "⚠️ No artifact directories found with expected names"
            echo "Checking for alternative structures..."
            # Если артефакты были извлечены в поддиректории (например, bundle/, Release/, etc.)
            # Ищем содержимое и перемещаем в правильные директории
            if [ -d "bundle" ]; then
              echo "Found bundle/ directory, creating linux-prod-release/"
              mkdir -p linux-prod-release
              mv bundle/* linux-prod-release/ 2>/dev/null || true
              rmdir bundle 2>/dev/null || true
            fi
            if [ -d "Release" ]; then
              echo "Found Release/ directory, checking platform..."
              # Определяем платформу по содержимому
              if find Release -name "*.exe" | head -1 | grep -q .; then
                echo "Windows detected, creating windows-prod-release/"
                mkdir -p windows-prod-release
                mv Release/* windows-prod-release/ 2>/dev/null || true
                rmdir Release 2>/dev/null || true
              elif find Release -name "*.app" | head -1 | grep -q .; then
                echo "macOS/iOS detected, checking..."
                APP_NAME=$(find Release -name "*.app" -type d | head -1 | xargs basename)
                if [ -n "$APP_NAME" ]; then
                  # Определяем по имени или другим признакам
                  echo "Creating macos-prod-release/ or ios-prod-release/"
                  mkdir -p macos-prod-release
                  mv Release/* macos-prod-release/ 2>/dev/null || true
                  rmdir Release 2>/dev/null || true
                fi
              fi
            fi
          else
            echo "✅ Found artifact directories:"
            echo "$ARTIFACT_DIRS"
          fi
          
          echo ""
          echo "=== Final artifact directories ==="
          find . -maxdepth 1 -type d \( -name "linux-*" -o -name "windows-*" -o -name "macos-*" -o -name "ios-*" \) 2>/dev/null | sort

      - name: Package Linux artifacts
        shell: bash
        run: |
          FOUND_ANY=false
          for dir in $(find . -maxdepth 1 -type d -name "linux-*-release" 2>/dev/null | sort); do
            if [ -d "$dir" ]; then
              FOUND_ANY=true
              dir_name=$(basename "$dir")
              flavor=$(echo "$dir_name" | sed 's/linux-\(.*\)-release/\1/')
              echo "Packaging Linux $flavor from $dir"
              if [ -f "$dir/mosstroinform_mobile" ] || [ -f "$dir/run.sh" ] || [ -n "$(find "$dir" -maxdepth 1 -type f 2>/dev/null | head -1)" ]; then
                tar -czf "mosstroinform_mobile-linux-$flavor.tar.gz" -C "$dir" .
                echo "✅ Created: mosstroinform_mobile-linux-$flavor.tar.gz"
              else
                echo "⚠️ Warning: No files found in $dir"
                ls -la "$dir" || true
              fi
            fi
          done
          if [ "$FOUND_ANY" = "false" ]; then
            echo "⚠️ No Linux artifact directories found"
          fi
          ls -lh *.tar.gz 2>/dev/null || echo "No Linux archives created"

      - name: Package Windows artifacts
        shell: bash
        run: |
          FOUND_ANY=false
          for dir in $(find . -maxdepth 1 -type d -name "windows-*-release" 2>/dev/null | sort); do
            if [ -d "$dir" ]; then
              FOUND_ANY=true
              dir_name=$(basename "$dir")
              flavor=$(echo "$dir_name" | sed 's/windows-\(.*\)-release/\1/')
              echo "Packaging Windows $flavor from $dir"
              if find "$dir" -name "*.exe" | head -1 | grep -q .; then
                cd "$dir"
                zip -r "../mosstroinform_mobile-windows-$flavor.zip" .
                cd ..
                echo "✅ Created: mosstroinform_mobile-windows-$flavor.zip"
              else
                echo "⚠️ Warning: No .exe found in $dir"
                ls -la "$dir" || true
              fi
            fi
          done
          if [ "$FOUND_ANY" = "false" ]; then
            echo "⚠️ No Windows artifact directories found"
          fi
          ls -lh *.zip 2>/dev/null | grep windows || echo "No Windows archives created"

      - name: Package macOS artifacts
        shell: bash
        run: |
          ORIGINAL_DIR=$(pwd)
          FOUND_ANY=false
          for dir in $(find . -maxdepth 1 -type d -name "macos-*-release" 2>/dev/null | sort); do
            if [ -d "$dir" ]; then
              FOUND_ANY=true
              dir_name=$(basename "$dir")
              flavor=$(echo "$dir_name" | sed 's/macos-\(.*\)-release/\1/')
              echo "Packaging macOS $flavor from $dir"
              APP_PATH=$(find "$dir" -name "*.app" -type d | head -1)
              if [ -n "$APP_PATH" ]; then
                APP_NAME=$(basename "$APP_PATH")
                APP_DIR=$(dirname "$APP_PATH")
                cd "$APP_DIR"
                zip -r "$ORIGINAL_DIR/mosstroinform_mobile-macos-$flavor.zip" "$APP_NAME"
                cd "$ORIGINAL_DIR"
                echo "✅ Created: mosstroinform_mobile-macos-$flavor.zip"
              else
                echo "⚠️ Warning: No .app found in $dir"
                ls -la "$dir" || true
              fi
            fi
          done
          if [ "$FOUND_ANY" = "false" ]; then
            echo "⚠️ No macOS artifact directories found"
          fi
          ls -lh *.zip 2>/dev/null | grep macos || echo "No macOS archives created"

      - name: Package iOS artifacts
        shell: bash
        run: |
          ORIGINAL_DIR=$(pwd)
          FOUND_ANY=false
          for dir in $(find . -maxdepth 1 -type d -name "ios-*-release" 2>/dev/null | sort); do
            if [ -d "$dir" ]; then
              FOUND_ANY=true
              dir_name=$(basename "$dir")
              flavor=$(echo "$dir_name" | sed 's/ios-\(.*\)-release/\1/')
              echo "Packaging iOS $flavor from $dir"
              APP_PATH=$(find "$dir" -name "*.app" -type d | head -1)
              if [ -n "$APP_PATH" ]; then
                APP_NAME=$(basename "$APP_PATH")
                APP_DIR=$(dirname "$APP_PATH")
                cd "$APP_DIR"
                zip -r "$ORIGINAL_DIR/mosstroinform_mobile-ios-$flavor.zip" "$APP_NAME"
                cd "$ORIGINAL_DIR"
                echo "✅ Created: mosstroinform_mobile-ios-$flavor.zip"
              else
                echo "⚠️ Warning: No .app found in $dir"
                ls -la "$dir" || true
              fi
            fi
          done
          if [ "$FOUND_ANY" = "false" ]; then
            echo "⚠️ No iOS artifact directories found"
          fi
          ls -lh *.zip 2>/dev/null | grep ios || echo "No iOS archives created"

      - name: List all release files
        run: |
          echo "=== Release files ==="
          ls -lh *.apk *.tar.gz *.zip 2>/dev/null || echo "No release files found"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.apk
            *.tar.gz
            *.zip
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Автоматическая сборка из ветки main
            
            ## 📱 Android APK
            - Mock: `app-mock-release.apk`
            - Prod: `app-prod-release.apk`
            
            ## 💻 Desktop
            - Linux: `mosstroinform_mobile-linux-prod.tar.gz`
            - Windows: `mosstroinform_mobile-windows-prod.zip`
            - macOS: `mosstroinform_mobile-macos-mock.zip`, `mosstroinform_mobile-macos-prod.zip`
            
            ## 🍎 iOS
            - Mock: `mosstroinform_mobile-ios-mock.zip`
            - Prod: `mosstroinform_mobile-ios-prod.zip`
            
            Commit: ${{ github.sha }}
            Автор: ${{ github.actor }}
            Дата: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build Desktop
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux
            flavor: prod
          - os: windows-latest
            platform: windows
            artifact_name: windows
            flavor: prod
          - os: macos-latest
            platform: macos
            artifact_name: macos
            flavor: mock
          - os: macos-latest
            platform: macos
            artifact_name: macos
            flavor: prod

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Linux/Windows)
        if: matrix.os != 'macos-latest'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libcurl4-openssl-dev libmpv-dev
          # Обновляем кэш pkg-config для корректного обнаружения mpv
          sudo ldconfig

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Build ${{ matrix.platform }} (${{ matrix.flavor }})
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            # Для macOS используем только --dart-define, так как macOS не поддерживает --flavor напрямую
            # Flavor определяется через схемы Xcode или через --dart-define
            # Отключаем подпись кода для CI/CD сборки
            export CODE_SIGN_IDENTITY=""
            export CODE_SIGNING_REQUIRED=NO
            export CODE_SIGNING_ALLOWED=NO
            flutter build ${{ matrix.platform }} --release --dart-define=FLAVOR=${{ matrix.flavor }}
          else
            # Для Linux и Windows не передаем FLAVOR, используется дефолт prod
            flutter build ${{ matrix.platform }} --release
          fi
        continue-on-error: false

      - name: Determine artifact path
        id: artifact_path
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "linux" ]; then
            echo "path=build/linux/x64/release/bundle" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            echo "path=build/windows/x64/runner/Release" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            # Для macOS путь одинаковый для всех flavors
            # Ищем .app файл в директории Release
            APP_NAME=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1 | xargs basename)
            if [ -z "$APP_NAME" ]; then
              echo "Error: No .app file found in build/macos/Build/Products/Release/"
              ls -la build/macos/Build/Products/Release/ 2>/dev/null || echo "Release directory not found"
              exit 1
            fi
            echo "path=build/macos/Build/Products/Release/$APP_NAME" >> $GITHUB_OUTPUT
            echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          fi
          
      - name: Verify artifact exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "linux" ]; then
            if [ ! -d "build/linux/x64/release/bundle" ]; then
              echo "Error: Linux bundle not found"
              ls -la build/linux/x64/release/ || echo "Release directory not found"
              exit 1
            fi
            echo "Linux bundle verified: build/linux/x64/release/bundle"
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            # Для Windows используем PowerShell-совместимую проверку
            if [ ! -d "build/windows/x64/runner/Release" ]; then
              echo "Error: Windows Release directory not found"
              ls -la build/windows/x64/runner/ 2>/dev/null || echo "Runner directory not found"
              exit 1
            fi
            echo "Windows Release verified: build/windows/x64/runner/Release"
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "Error: macOS app not found"
              ls -la build/macos/Build/Products/Release/ 2>/dev/null || echo "Release directory not found"
              exit 1
            fi
            echo "macOS app verified: $APP_PATH"
          fi

      - name: Upload ${{ matrix.platform }} artifact (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.flavor }}-release
          path: ${{ steps.artifact_path.outputs.path }}
          retention-days: 30
          if-no-files-found: warn

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Build Web (prod)
        run: flutter build web --release --base-href /mosstroinform_mobile/
        continue-on-error: false

      - name: Upload Web artifact (prod)
        uses: actions/upload-artifact@v4
        with:
          name: web-prod-release
          path: build/web
          retention-days: 30

  deploy-web:
    name: Deploy Web to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: web-prod-release
          path: web-builds

      - name: List downloaded files
        run: |
          echo "=== Web build structure ==="
          find web-builds -type f -name "*.html" | head -5 || echo "No HTML files found"
          ls -la web-builds/ || echo "web-builds directory not found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-builds/web-prod-release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios:
    name: Build iOS
    needs: test
    strategy:
      matrix:
        include:
          - flavor: mock
          - flavor: prod

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (${{ matrix.flavor }})
        run: |
          export CODE_SIGN_IDENTITY=""
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGNING_ALLOWED=NO
          flutter build ios --release --flavor ${{ matrix.flavor }} --dart-define=FLAVOR=${{ matrix.flavor }} --no-codesign
        continue-on-error: false

      - name: Determine artifact path
        id: artifact_path
        shell: bash
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app file found in build/ios/iphoneos/"
            ls -la build/ios/iphoneos/ 2>/dev/null || echo "iphoneos directory not found"
            exit 1
          fi
          echo "path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "app_name=$(basename "$APP_PATH")" >> $GITHUB_OUTPUT
          echo "iOS app verified: $APP_PATH"

      - name: Upload iOS artifact (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.flavor }}-release
          path: ${{ steps.artifact_path.outputs.path }}
          retention-days: 30
